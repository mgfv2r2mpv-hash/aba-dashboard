name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CI: true

jobs:
  type-check:
    runs-on: ubuntu-latest
    name: TypeScript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --pretty false --listFiles false 2>&1 | tee tsc-output.txt

      - name: Parse type errors
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('tsc-output.txt', 'utf-8');
            const errors = (output.match(/error TS\d+:/g) || []).length;
            const warnings = (output.match(/warning TS\d+:/g) || []).length;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## @claude-typecheck-results\n**Errors:** ${errors}\n**Warnings:** ${warnings}\n${errors > 0 ? '❌ Fix type errors before merging' : '✅'}`
            });

  security-scan:
    runs-on: ubuntu-latest
    name: Dependency Security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for vulnerabilities
        run: npm audit --audit-level=moderate 2>&1 || true

      - name: Search for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          if grep -r "ANTHROPIC_API_KEY\|api_key\|apiKey.*=" src/ --include="*.ts" --include="*.tsx" --include="*.js"; then
            echo "❌ Found potential hardcoded secrets!"
            exit 1
          else
            echo "✅ No obvious hardcoded secrets detected"
          fi

  lint-summary:
    runs-on: ubuntu-latest
    needs: [type-check, security-scan]
    if: always()
    steps:
      - name: Report quality gate status
        run: |
          if [ "${{ needs.type-check.result }}" = "failure" ] || [ "${{ needs.security-scan.result }}" = "failure" ]; then
            echo "## @claude-lint-failed" >> $GITHUB_STEP_SUMMARY
            echo "Quality checks failed. Review logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## @claude-lint-passed" >> $GITHUB_STEP_SUMMARY
            echo "All quality checks passing." >> $GITHUB_STEP_SUMMARY
          fi
