name = "sassi-cal-webportal"
pages_build_output_dir = "dist"

# Cloudflare Pages dashboard settings (set these when connecting GitHub):
#   Framework preset : None
#   Build command    : npm install && npm run build
#     (`build` runs `tsc --noEmit` first: the portal imports ../src across a seam
#      the app's CI never builds, so a shared-component deletion must fail here.)
#   Build output dir : dist
#   Root directory   : webportal
#   Node version     : 20

# SECRET, set in the Pages dashboard (Settings -> Variables and Secrets), for both
# Production and Preview: ANTHRO_API_KEY. functions/api/claude/v1/messages.ts
# reads it; until it is there the assistant answers 503 and says so on screen.
# The name is the one on the project, not the vendor's conventional
# ANTHROPIC_API_KEY. Rename the secret and this line together or neither.
# It is deliberately NOT in [vars] below - those are plaintext in the repo.

# The staff login store. migrations/0001_portal_users.sql is its schema, and it has
# been applied to this database already.
#
# THIS BLOCK IS WHY THE DASHBOARD REFUSES TO ADD THE BINDING. Because this project
# sets pages_build_output_dir above, Cloudflare treats this file as the SOURCE OF
# TRUTH for the project's configuration and disables binding editing in the dashboard.
# Bindings for this project are added here and nowhere else.
#
# It is deliberately top-level rather than under [env.production] / [env.preview].
# Non-inheritable keys in a Pages config are all-or-nothing per environment: override
# one of them for one environment and EVERY non-inheritable key must then be spelled
# out for both, which would mean duplicating [vars] below as well. Top-level applies
# to production, preview and `wrangler pages dev` alike.
#
# The consequence to know about: preview builds and production share ONE login store.
# For a handful of staff accounts that is what you want, because your real account
# works on a branch preview. If the two ever need separating, the change is an
# [env.preview] block and a second database, and [vars] has to be duplicated with it.
[[d1_databases]]
binding = "PORTAL_DB"
database_name = "sassi-portal"
database_id = "17d2b7ff-b50d-4b33-ad4d-5eed49688fae"


# Cloudflare Access gate config, read by functions/_middleware.ts.
# These are non-secret identifiers (POLICY_AUD is the app's Audience tag, not a secret).
#
# They stay here even after app login becomes the door. Once PORTAL_DB is bound the
# portal's own session is what gates the API, but the middleware still VERIFIES an
# Access token when one is presented, because that verified email is what lets the
# very first admin account be created before any account exists to sign in with.
[vars]
TEAM_DOMAIN = "https://t-nooutco-me.cloudflareaccess.com"
POLICY_AUD = "4cbdc060e7b12fb88a66a79b369c45c11d311e590dac403de88317728eea1f0d"
