name = "sassi-cal-webportal"
pages_build_output_dir = "dist"

# Cloudflare Pages dashboard settings (set these when connecting GitHub):
#   Framework preset : None
#   Build command    : npm install && npm run build
#     (`build` runs `tsc --noEmit` first: the portal imports ../src across a seam
#      the app's CI never builds, so a shared-component deletion must fail here.)
#   Build output dir : dist
#   Root directory   : webportal
#   Node version     : 20

# SECRET, set in the Pages dashboard (Settings -> Variables and Secrets), for both
# Production and Preview: ANTHRO_API_KEY. functions/api/claude/v1/messages.ts
# reads it; until it is there the assistant answers 503 and says so on screen.
# The name is the one on the project, not the vendor's conventional
# ANTHROPIC_API_KEY. Rename the secret and this line together or neither.
# It is deliberately NOT in [vars] below - those are plaintext in the repo.

# BINDING, set in the Pages dashboard (Settings -> Bindings), for both Production and
# Preview: a D1 database bound as PORTAL_DB. It holds the staff login store, and
# migrations/0001_portal_users.sql is its schema. Bindings are project settings that a
# deploy does not create, and they attach AT DEPLOY TIME: one added after a deployment
# does not reach it, so add it and then redeploy. Until it is there every endpoint
# under functions/api/auth and functions/api/admin answers 503 and says so on screen.

# Cloudflare Access gate config, read by functions/_middleware.js.
# These are non-secret identifiers (POLICY_AUD is the app's Audience tag, not a secret).
[vars]
TEAM_DOMAIN = "https://t-nooutco-me.cloudflareaccess.com"
POLICY_AUD = "4cbdc060e7b12fb88a66a79b369c45c11d311e590dac403de88317728eea1f0d"
